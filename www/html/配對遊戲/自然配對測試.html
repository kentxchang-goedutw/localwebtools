<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自然配對測試</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shrikhand&display=swap');
        .pop-pink { background-color: #FF69B4; }
        .pop-yellow { background-color: #FFD700; }
        .pop-blue { background-color: #00BFFF; }
        .pop-green { background-color: #32CD32; }
        .pop-red { background-color: #FF4500; }
        .pop-purple { background-color: #9370DB; }
        h1, h2, .font-pop { font-family: 'Shrikhand', cursive; text-shadow: 4px 4px 0px rgba(0,0,0,0.2); }
        @font-face { font-family: 'ㄅ注音芫荽 Regular'; src: url('https://kentxchang-goedutw.github.io/web/BpmfIansui-Regular_0.ttf') format('truetype'); font-weight: normal; font-style: normal; }
        .use-zhuyin { font-family: 'ㄅ注音芫荽 Regular', sans-serif !important; }
        body { background-image: linear-gradient(45deg, #FF69B4, #FFD700, #00BFFF); animation: background-animate 15s ease infinite; background-size: 300% 300%; }
        @keyframes background-animate { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .card { transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease; cursor: pointer; box-shadow: 8px 8px 0px rgba(0,0,0,0.2); border: 4px solid black; text-align: center; }
        .card:hover { transform: translateY(-5px); box-shadow: 12px 12px 0px rgba(0,0,0,0.3); }
        .card.matched { animation: matched-pop 0.5s forwards; }
        @keyframes matched-pop { 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.1);opacity:1} 100%{transform:scale(0);opacity:0} }
        .card.unmatched { animation: unmatched-shake 0.5s; }
        @keyframes unmatched-shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)} }
        .game-board { display: grid; gap: 16px; }
        .btn-style { transition: all 0.2s ease-in-out; box-shadow: 6px 6px 0px rgba(0,0,0,0.2); border: 3px solid black; }
        .btn-style:hover { transform: translateY(-2px); box-shadow: 8px 8px 0px rgba(0,0,0,0.3); }
        .mode-button { filter: brightness(0.8); }
        .mode-button.active { filter: brightness(1.2); }
        #whac-a-mole-question { min-height: 8rem; }
        .mole-hole { position: relative; background-color: #6d4c41; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 4px solid black; }
        .mole-card { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out; cursor: pointer; border: none; box-shadow: none; border-radius: 50%; }
        .mole-card.popped { opacity: 1; visibility: visible; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .transform-rotate-y-180 { transform: rotateY(180deg); }
        #flashcard-back { transform: rotateY(180deg); }
        #flashcard-container { cursor: pointer; }
    </style>
</head>
<body class="p-8 text-white min-h-screen flex flex-col items-center">
    <div class="fixed top-4 right-4 text-xs font-pop text-black opacity-70">Made by 阿剛老師</div>
    <div id="game-options" class="w-full max-w-4xl mx-auto bg-white/20 backdrop-blur-lg rounded-3xl p-6 shadow-xl border-4 border-white mb-8">
        <div class="flex flex-col lg:flex-row justify-between items-center space-y-6 lg:space-y-0 lg:space-x-8">
            <div class="flex justify-center items-center lg:justify-start lg:w-1/3">
                <span class="text-xl font-bold text-black mr-4 whitespace-nowrap">注音字體開關:</span>
                <label for="zhuyin-toggle" class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" value="" id="zhuyin-toggle" class="sr-only peer">
                    <div class="w-14 h-7 bg-gray-300 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-pop-pink rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-pop-pink"></div>
                </label>
            </div>
            <div class="w-full lg:w-2/3 text-center lg:text-right">
                <h2 class="text-2xl font-bold text-black mb-4 lg:hidden">選擇遊戲模式</h2>
                <div class="flex flex-col sm:flex-row justify-center lg:justify-end space-y-4 sm:space-y-0 sm:space-x-4">
                    <button class="mode-button btn-style pop-pink text-white py-3 px-6 rounded-xl text-lg font-bold" data-mode="flashcard">翻卡練習</button>
                    <button class="mode-button btn-style pop-blue text-white py-3 px-6 rounded-xl text-lg font-bold" data-mode="random-match">隨機配對</button>
                    <button class="mode-button btn-style pop-green text-white py-3 px-6 rounded-xl text-lg font-bold" data-mode="whac-a-mole">打地鼠</button>
                </div>
            </div>
        </div>
    </div>
    <div id="input-area-container" class="w-full max-w-4xl bg-white/20 backdrop-blur-lg rounded-3xl p-6 shadow-xl border-4 border-white mb-8 hidden">
        <div class="flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0 md:space-x-4">
            <div class="w-full">
                <h2 class="text-2xl font-bold text-black mb-2">貼上你的題目</h2>
                <textarea id="question-input" rows="5" class="w-full p-3 rounded-lg bg-gray-100 text-gray-800 focus:outline-none focus:ring-4 focus:ring-pop-blue border-2 border-gray-300 transition-all" placeholder="每行一組，例如：&#10;蘋果,apple&#10;香蕉&#9;banana&#10;...">光合作用	植物利用陽光將二氧化碳和水轉化為養分
水的三態	水可分為固態、液態與氣態三種狀態
地心引力	地球吸引物體朝向中心靠攏的作用力
毛細現象	液體在細微縫隙中自動升降的現象
熱脹冷縮	物體受熱時體積膨脹、遇冷時收縮
生態系	生物與周圍環境互相影響構成的系統
食物鏈	生物之間藉由吃與被吃傳遞能量的關係
風化作用	岩石長期受風吹雨打而破裂碎裂的過程
顯微鏡	能放大肉眼看不到的微小物體的儀器
電路	電流能夠順利流通的完整閉合通路</textarea>
            </div>
            <div class="flex-shrink-0">
                <button id="generate-btn" class="btn-style pop-red text-white py-3 px-6 rounded-xl text-lg font-bold">產生題目</button>
            </div>
        </div>
    </div>
    <div id="game-container" class="w-full max-w-4xl bg-white/20 backdrop-blur-lg rounded-3xl p-6 shadow-xl border-4 border-white">
        <div id="flashcard-area" class="hidden flex flex-col items-center">
            <div id="card-status" class="text-xl font-bold text-black mb-4"></div>
            <div id="flashcard-container" class="w-full max-w-md h-64 md:h-80 perspective-1000">
                <div id="flashcard-card" class="relative w-full h-full transform-style-preserve-3d transition-transform duration-500 shadow-2xl rounded-xl border-4 border-black">
                    <div id="flashcard-front" class="absolute w-full h-full backface-hidden flex items-center justify-center pop-yellow rounded-xl p-4 text-black text-3xl font-bold">正面內容</div>
                    <div id="flashcard-back" class="absolute w-full h-full backface-hidden transform-rotate-y-180 flex items-center justify-center pop-blue rounded-xl p-4 text-white text-3xl font-bold">反面內容</div>
                </div>
            </div>
            <div class="flex flex-wrap justify-center space-x-2 sm:space-x-4 mt-6">
                <button id="prev-card-btn" class="btn-style pop-red text-white py-2 px-4 rounded-xl text-base font-bold" disabled>上一頁</button>
                <button id="speak-btn" class="btn-style pop-green text-white py-2 px-4 rounded-xl text-base font-bold">播音 🔊</button>
                <button id="next-card-btn" class="btn-style pop-red text-white py-2 px-4 rounded-xl text-base font-bold">下一頁</button>
            </div>
        </div>
        <div id="game-info" class="text-center mb-4 text-2xl font-bold text-black rounded-xl p-2 border-2 border-black inline-block"></div>
        <div id="whac-a-mole-question" class="text-center text-4xl font-bold text-black mb-6 flex items-center justify-center hidden pop-yellow rounded-xl p-4 border-4 border-black"></div>
        <div id="game-board" class="game-board justify-center"></div>
        <div id="status-message" class="text-center text-3xl font-pop mt-4 text-black"></div>
        <div class="flex justify-center mt-6">
            <button id="restart-btn" class="btn-style pop-red text-white py-3 px-6 rounded-xl text-lg font-bold hidden">重新開始</button>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputAreaContainer = document.getElementById('input-area-container');
            const questionInput = document.getElementById('question-input');
            const generateBtn = document.getElementById('generate-btn');
            const gameBoard = document.getElementById('game-board');
            const statusMessage = document.getElementById('status-message');
            const gameInfo = document.getElementById('game-info');
            const restartBtn = document.getElementById('restart-btn');
            const modeButtons = document.querySelectorAll('.mode-button');
            const whacAMoleQuestion = document.getElementById('whac-a-mole-question');
            const body = document.body;
            const zhuyinToggle = document.getElementById('zhuyin-toggle');
            const flashcardArea = document.getElementById('flashcard-area');
            const flashcardContainer = document.getElementById('flashcard-container');
            const flashcardCard = document.getElementById('flashcard-card');
            const flashcardFront = document.getElementById('flashcard-front');
            const flashcardBack = document.getElementById('flashcard-back');
            const cardStatus = document.getElementById('card-status');
            const prevCardBtn = document.getElementById('prev-card-btn');
            const nextCardBtn = document.getElementById('next-card-btn');
            const speakBtn = document.getElementById('speak-btn');
            let words=[],shuffledWords=[],flippedCards=[],matchedCount=0,canFlip=true,gameMode='flashcard',pairedItems=[],currentQuestion=null,questionIndex=0,moleInterval=null,moleTimeout=null,activeMoles=[];
            let cardIndex=0,isFlipped=false,startTime=null,timerInterval=null;
            const cardColors=['pop-pink','pop-yellow','pop-blue','pop-green','pop-red','pop-purple'];
            const gameContainer=document.getElementById('game-container');
            function showStatus(m,bg){statusMessage.innerText=m;statusMessage.classList.remove('pop-yellow','pop-green','pop-red','pop-blue','bg-pop-yellow','bg-pop-green','bg-pop-red','bg-pop-blue');statusMessage.classList.add('text-black');if(bg){statusMessage.classList.add(bg,'px-4','py-2','rounded-xl','font-bold')}else if(m===''){statusMessage.classList.remove('px-4','py-2','rounded-xl','font-bold')}}
            function formatTime(s){const m=Math.floor(s/60);return `${m.toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`}
            function startTimer(){stopTimer();startTime=Date.now();gameInfo.innerText="時間: 00:00";gameInfo.classList.remove('hidden');timerInterval=setInterval(()=>{gameInfo.innerText=`時間: ${formatTime((Date.now()-startTime)/1000)}`},1000)}
            function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
            function speakText(text){if('speechSynthesis' in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=/[a-zA-Z]/.test(text)?'en-US':'zh-TW';const v=window.speechSynthesis.getVoices().find(v=>v.lang.includes(u.lang));if(v)u.voice=v;window.speechSynthesis.speak(u)}else{showStatus('瀏覽器不支援語音播報功能。','pop-red')}}
            function clearTimers(){stopTimer();if(moleInterval){clearInterval(moleInterval);moleInterval=null}if(moleTimeout){clearTimeout(moleTimeout);moleTimeout=null}activeMoles.forEach(m=>{m.classList.remove('popped');m.removeEventListener('click',handleWhacAMoleClick)});activeMoles=[]}
            function parseInput(){const t=questionInput.value.trim();if(!t){showStatus('請先輸入題目內容！','pop-blue');return[]}return t.split('\n').reduce((acc,line)=>{const p=line.split(/[\t,]/).map(s=>s.trim()).filter(s=>s.length>0);if(p.length===2)acc.push({id:acc.length,word:p[0],match:p[1]});return acc},[])}
            function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
            function startGame(mode){gameMode=mode;words=parseInput();clearTimers();gameBoard.innerHTML='';gameInfo.innerText='';gameInfo.classList.add('hidden');whacAMoleQuestion.classList.add('hidden');flashcardArea.classList.add('hidden');showStatus('','');restartBtn.classList.add('hidden');if(words.length===0)return;modeButtons.forEach(b=>b.classList.remove('active'));document.querySelector(`[data-mode="${mode}"]`).classList.add('active');matchedCount=0;canFlip=true;if(gameMode==='random-match')startRandomMatchGame();else if(gameMode==='whac-a-mole')startWhacAMoleGame();else if(gameMode==='flashcard')startFlashcardGame()}
            function startFlashcardGame(){gameBoard.style.gridTemplateColumns='1fr';flashcardArea.classList.remove('hidden');gameInfo.classList.add('hidden');pairedItems=[...words];cardIndex=0;isFlipped=false;if(pairedItems.length===0){showStatus('請先輸入有效的配對題目！','pop-red');return}updateFlashcardDisplay()}
            function updateFlashcardDisplay(){if(pairedItems.length===0)return;const c=pairedItems[cardIndex];flashcardFront.innerText=c.word;flashcardBack.innerText=c.match;isFlipped=false;flashcardCard.style.transform='rotateY(0deg)';cardStatus.innerText=`第 ${cardIndex+1} / ${pairedItems.length} 張卡`;prevCardBtn.disabled=cardIndex===0;nextCardBtn.disabled=cardIndex===pairedItems.length-1;flashcardFront.style.fontSize=Math.min(30,180/Math.sqrt(c.word.length))+'px';flashcardBack.style.fontSize=Math.min(30,180/Math.sqrt(c.match.length))+'px'}
            function flipCard(){isFlipped=!isFlipped;flashcardCard.style.transform=isFlipped?'rotateY(180deg)':'rotateY(0deg)'}
            function navigateCard(d){const n=cardIndex+d;if(n>=0&&n<pairedItems.length){cardIndex=n;updateFlashcardDisplay()}}
            function handleSpeakClick(){const c=pairedItems[cardIndex];speakText(isFlipped?c.match:c.word)}
            prevCardBtn.addEventListener('click',()=>navigateCard(-1));nextCardBtn.addEventListener('click',()=>navigateCard(1));flashcardContainer.addEventListener('click',flipCard);speakBtn.addEventListener('click',handleSpeakClick);
            function startRandomMatchGame(){whacAMoleQuestion.classList.add('hidden');gameBoard.innerHTML='';const all=[];words.forEach(p=>{all.push({id:p.id,word:p.word});all.push({id:p.id,word:p.match})});shuffledWords=shuffle(all);shuffledWords.forEach((item,index)=>{const card=document.createElement('div');card.classList.add('card','flex','items-center','justify-center','text-center','p-4','rounded-lg','text-black','text-base','font-bold','select-none','h-32','sm:h-40');card.dataset.index=index;card.dataset.id=item.id;card.innerText=item.word;card.style.fontSize=Math.min(20,160/Math.sqrt(item.word.length))+'px';card.classList.add(cardColors[Math.floor(Math.random()*cardColors.length)]);card.addEventListener('click',handleRandomMatchClick);gameBoard.appendChild(card)});gameBoard.style.gridTemplateColumns='repeat(4,minmax(100px,1fr))';startTimer()}
            function handleRandomMatchClick(){if(!canFlip)return;const c=this;if(flippedCards.includes(c)||c.classList.contains('matched'))return;flippedCards.push(c);c.classList.remove(...cardColors);c.classList.add('pop-yellow','text-black');c.removeEventListener('click',handleRandomMatchClick);if(flippedCards.length===2){canFlip=false;const[a,b]=flippedCards;if(a.dataset.id===b.dataset.id){setTimeout(()=>{a.classList.add('matched');b.classList.add('matched');flippedCards=[];canFlip=true;matchedCount+=2;if(matchedCount===shuffledWords.length)endGame(true)},500)}else{setTimeout(()=>{a.classList.remove('pop-yellow','text-black');b.classList.remove('pop-yellow','text-black');a.classList.add(cardColors[Math.floor(Math.random()*cardColors.length)]);b.classList.add(cardColors[Math.floor(Math.random()*cardColors.length)]);a.addEventListener('click',handleRandomMatchClick);b.addEventListener('click',handleRandomMatchClick);flippedCards=[];canFlip=true},1000)}}}
            function startWhacAMoleGame(){whacAMoleQuestion.classList.remove('hidden');gameBoard.innerHTML='';pairedItems=shuffle([...words]);questionIndex=0;if(pairedItems.length===0){endGame(false);return}gameBoard.style.gridTemplateColumns='repeat(3,1fr)';for(let i=0;i<9;i++){const h=document.createElement('div');h.classList.add('mole-hole','h-32','w-32','sm:h-40','sm:w-40');gameBoard.appendChild(h)}startTimer();updateWhacAMoleGame()}
            function updateWhacAMoleGame(){if(questionIndex>=pairedItems.length){endGame(true);return}canFlip=true;showStatus('','');currentQuestion=pairedItems[questionIndex];whacAMoleQuestion.innerText=currentQuestion.word;startMoleLoop()}
            function startMoleLoop(){clearTimers();const holes=document.querySelectorAll('.mole-hole');const interval=Math.random()*1000+1000;moleInterval=setInterval(()=>{activeMoles.forEach(m=>m.classList.remove('popped'));activeMoles=[];const all=words.map(i=>({id:i.id,word:i.match}));const wrong=all.filter(i=>i.id!==currentQuestion.id);const sw=shuffle(wrong);const ans=shuffle([{id:currentQuestion.id,word:currentQuestion.match},sw.length>0?sw[Math.floor(Math.random()*sw.length)]:{id:-1,word:'錯誤答案'}]);const hi=[];while(hi.length<2){const ri=Math.floor(Math.random()*holes.length);if(!hi.includes(ri))hi.push(ri)}hi.forEach((idx,i)=>{const h=holes[idx];const mc=document.createElement('div');mc.classList.add('card','mole-card','flex','items-center','justify-center','p-4','font-bold','select-none','pop-purple');mc.dataset.id=ans[i].id;mc.innerText=ans[i].word;mc.style.fontSize=Math.min(20,160/Math.sqrt(ans[i].word.length))+'px';const ex=h.querySelector('.mole-card');if(ex)ex.removeEventListener('click',handleWhacAMoleClick);h.innerHTML='';h.appendChild(mc);setTimeout(()=>mc.classList.add('popped'),10);activeMoles.push(mc);mc.addEventListener('click',handleWhacAMoleClick)});moleTimeout=setTimeout(()=>{activeMoles.forEach(m=>m.classList.remove('popped'));activeMoles=[]},2000)},interval)}
            function handleWhacAMoleClick(){if(!canFlip||activeMoles.length===0)return;const c=this;if(parseInt(c.dataset.id)===currentQuestion.id){canFlip=false;clearTimers();showStatus('答對了！🎉','pop-green');c.classList.remove('popped');setTimeout(()=>{questionIndex++;updateWhacAMoleGame()},1000)}else{showStatus('打錯了！❌','pop-red');c.classList.add('unmatched');setTimeout(()=>{c.classList.remove('unmatched');showStatus('','')},500)}}
            function endGame(isWin){stopTimer();canFlip=false;let msg='';if(isWin){const t=formatTime((Date.now()-startTime)/1000);msg=`恭喜你，全部配對成功！🎉 總耗時: ${t}`;whacAMoleQuestion.classList.add('hidden');gameBoard.innerHTML='';showStatus(msg,'pop-green');gameInfo.innerText=`最終時間: ${t}`}else{whacAMoleQuestion.classList.add('hidden');msg='遊戲結束。';showStatus(msg,'pop-red');gameInfo.innerText='';gameInfo.classList.add('hidden')}restartBtn.classList.remove('hidden')}
            zhuyinToggle.addEventListener('change',e=>{e.target.checked?body.classList.add('use-zhuyin'):body.classList.remove('use-zhuyin')});
            generateBtn.addEventListener('click',()=>{gameContainer.style.display='block';startGame(gameMode)});
            restartBtn.addEventListener('click',()=>startGame(gameMode));
            modeButtons.forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.mode)));
            modeButtons.forEach(b=>b.classList.remove('active'));
            document.querySelector('[data-mode="flashcard"]').classList.add('active');
            gameMode='flashcard';
            if(questionInput.value.trim().length>0){gameContainer.style.display='block';setTimeout(()=>startGame('flashcard'),100)}else{showStatus('請先輸入題目內容！','pop-blue')}
        });
    </script>
</body>
</html>
